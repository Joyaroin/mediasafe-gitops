# Temporary: proves the edge end to end — DNS, Traefik, the Gateway, the redirect and the
# certificate — on staging.mediasafe.space before the real app needs it. Delete this file and
# test/whoami/ once HTTPS is verified with a production certificate.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Joyaroin/mediasafe-gitops.git
    targetRevision: main
    path: test/whoami
  destination:
    server: https://kubernetes.default.svc
    namespace: whoami
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
