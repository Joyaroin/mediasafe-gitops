# The app on mediasafe.space: charts/mediasafe with values-prod.yaml, into the namespace
# platform/app-namespaces created with its SecretStore. promote.yml in the app repo deploys by
# committing staging's image.tag to that values file.
#
# Same Neon database as Vercel until the cutover: no merges to MediaSafe's main while both run,
# or two deploy paths would migrate it (ADR 0001, stage 8).
#
# No resources finalizer, like every app here: deleting this file must not delete the
# namespace's Secrets out from under a redeploy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mediasafe-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Joyaroin/mediasafe-gitops.git
    targetRevision: main
    path: charts/mediasafe
    helm:
      releaseName: mediasafe
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mediasafe-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
