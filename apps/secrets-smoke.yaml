# Temporary: proves the path from Vault to a Kubernetes Secret, and that staging cannot read
# prod. Delete this file and test/secrets-smoke/ once that has been seen.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-smoke
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Joyaroin/mediasafe-gitops.git
    targetRevision: main
    path: test/secrets-smoke
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
