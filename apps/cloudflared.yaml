# The Cloudflare Tunnel: the cluster's only way in from the internet. cloudflared dials out to
# Cloudflare, so the home network opens no ports. Which hostname goes where is the tunnel's
# configuration in Cloudflare, managed by MediaSafe's infra/terraform; this app only runs the
# connector, with the tunnel's token from Vault.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Joyaroin/mediasafe-gitops.git
    targetRevision: main
    path: platform/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
