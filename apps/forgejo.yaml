# Forgejo, a git server for the home lab: pull mirrors of the GitHub repos (a second copy that
# GitHub going away cannot take), and any repo that only lives at home. Reached only over the
# tailnet, at https://forgejo.tailf69bc5.ts.net.
#
# No resources finalizer: deleting this Application must not delete the repositories' volume.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
spec:
  project: default
  sources:
    # From an OCI registry, which Argo CD knows about from configs.repositories in
    # platform/argocd/values.yaml.
    - repoURL: code.forgejo.org/forgejo-helm
      chart: forgejo
      targetRevision: 17.3.2 # Forgejo 15.0.11
      helm:
        releaseName: forgejo
        valueFiles:
          - $values/platform/forgejo/values.yaml
    - repoURL: https://github.com/Joyaroin/morioh-cho-gitops.git
      targetRevision: main
      ref: values
    # The admin login from Vault, and the tailnet Ingress.
    - repoURL: https://github.com/Joyaroin/morioh-cho-gitops.git
      targetRevision: main
      path: platform/forgejo/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
