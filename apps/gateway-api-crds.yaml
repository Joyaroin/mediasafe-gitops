# The Gateway API itself: GatewayClass, Gateway, HTTPRoute and friends. Neither Traefik's chart
# nor cert-manager's ships these, and both need them before they start — so this is wave -3,
# and the wave-ordering health check in platform/argocd/values.yaml makes the next wave wait.
#
# v1.6.1 is the version Traefik v3.7 is built against (traefik/traefik go.mod). Upgrade the two
# together.
#
# No resources finalizer: deleting this Application must never delete the CRDs, which would
# delete every Gateway and HTTPRoute in the cluster with them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.1
    path: config/crd # the standard channel, via its kustomization
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # the CRDs are too large for client-side apply
