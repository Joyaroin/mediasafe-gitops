# Argo CD, managing itself. bootstrap/install renders this same chart, version and values
# once; after that an upgrade is a change to targetRevision here, and nothing else.
#
# No resources finalizer, for the same reason as root: removing this file must not uninstall
# the thing that would have to put it back.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.9.6 # Argo CD v3.5.3
      helm:
        # Must match bootstrap/install, so Argo adopts the resources the bootstrap created.
        releaseName: argocd
        valueFiles:
          - $values/platform/argocd/values.yaml
    - repoURL: git@github.com:Joyaroin/mediasafe-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The bootstrap applies server-side; staying server-side keeps one field manager, and
      # Argo CD's CRDs are too large for client-side apply's annotation anyway.
      - ServerSideApply=true
