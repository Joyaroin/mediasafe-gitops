# External Secrets Operator: copies Vault values into ordinary Kubernetes Secrets, so the app
# keeps reading process.env. Wave -2, so its CRDs exist before any SecretStore is synced.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.11.0
      helm:
        valueFiles:
          - $values/platform/external-secrets/values.yaml
    - repoURL: git@github.com:Joyaroin/mediasafe-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # the CRDs are too large for client-side apply
