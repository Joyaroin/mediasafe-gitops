# Traefik, as the cluster's Gateway API implementation. k3s's ServiceLB binds its Service's
# ports 80 and 443 on the VM's public IP — there is no cloud load balancer.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 41.6.1 # Traefik v3.7.13
      helm:
        valueFiles:
          - $values/platform/traefik/values.yaml
    - repoURL: git@github.com:Joyaroin/mediasafe-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
