# Traefik, as the cluster's Gateway API implementation. Its Service is cluster-internal: traffic
# arrives through the Cloudflare Tunnel, never on a port of the node.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 41.6.1 # Traefik v3.7.13
      helm:
        # The chart's 27 CRDs are Traefik Hub's (a paid product) and Traefik's own IngressRoute
        # family — the provider for which is off; routes here are Gateway API HTTPRoutes. Each
        # CRD costs API-server memory on a 4 GB node, and none is used.
        skipCrds: true
        valueFiles:
          - $values/platform/traefik/values.yaml
    - repoURL: https://github.com/Joyaroin/morioh-cho-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
