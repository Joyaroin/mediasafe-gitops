# Valkey, the shared Next.js cache (cache-handler.mjs in the app repo). No volume: a restart
# empties it, and an empty cache is only slower.
#
# **noeviction, not an LRU policy.** Both kinds of key carry a TTL (entries 24 h, tag-bust
# timestamps 48 h), so any eviction policy may drop a bust timestamp while the entry it
# invalidates survives, and that entry would then be served stale with nothing reported. With
# noeviction a full Valkey refuses writes instead, which the handler reports. maxmemory sits
# far above a day of one tracker's reads, so it should never be reached.
#
# Wave -1, so the app's first pods find it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels: {{- include "mediasafe.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        {{- include "mediasafe.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          args:
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - {{ .Values.valkey.maxmemory | quote }}
            - --maxmemory-policy
            - noeviction
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels: {{- include "mediasafe.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
