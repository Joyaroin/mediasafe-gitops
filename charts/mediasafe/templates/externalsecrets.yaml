{{- include "mediasafe.required" . }}
# The app's settings and the image pull credential, from Vault through the namespace's
# SecretStore `vault` (platform/app-namespaces), which can read kv/mediasafe/<environment>/*
# and nothing else.
#
# Wave -1: Argo CD waits for both to be Healthy (synced) before the migration Job runs, since
# it needs DATABASE_URL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediasafe-app
  labels: {{- include "mediasafe.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: mediasafe-app
  # Every key at the path becomes an environment variable of the same name.
  dataFrom:
    - extract:
        key: mediasafe/{{ .Values.environment }}/app
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  labels: {{- include "mediasafe.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ `{{ printf "%s:%s" .username .token | b64enc }}` }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: mediasafe/{{ .Values.environment }}/ghcr
        property: username
    - secretKey: token
      remoteRef:
        key: mediasafe/{{ .Values.environment }}/ghcr
        property: token
