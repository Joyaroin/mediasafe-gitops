# mediasafe.space. Prod takes an image only from staging, through the app repo's promote.yml,
# which copies values-staging.yaml's tag here.
environment: prod
hostname: mediasafe.space
gatewayListener: https-apex
image:
  tag: 89ef83fb30166f1f2d15269302febe854338810c
# Two, so a rolling deploy or one pod's crash leaves the site up. They share one Valkey, which
# is what keeps a write on one replica from leaving the other's cache stale.
replicas: 2
sweep:
  schedule: "0 9 * * *"
  # Runs here since the cutover (ADR 0001, stage 9). Vercel Cron, which ran it before, is
  # disabled: two sweeps would refresh the same titles twice.
  suspend: false
