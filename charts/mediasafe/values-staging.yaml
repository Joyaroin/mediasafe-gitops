# staging.mediasafe.space. Every merge deploys here: CI commits the new image's SHA below.
environment: staging
hostname: staging.mediasafe.space
gatewayListener: https-staging
# On hermit, never with prod. See values-prod.yaml.
nodeSelector:
  kubernetes.io/hostname: hermit
image:
  tag: db2c29cd38d1611dd3cea8fa5f7ed7e8a9eb9211
sweep:
  # Two hours before prod's, so a sweep that breaks on new code breaks here first.
  schedule: "0 7 * * *"
