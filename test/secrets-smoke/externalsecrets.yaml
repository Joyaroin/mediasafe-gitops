# Each environment reads its own test value. The third asks staging's store for prod's path:
# Vault must refuse it, and the ExternalSecret must stay unsynced.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smoke
  namespace: mediasafe-staging
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: smoke
  data:
    - secretKey: message
      remoteRef:
        key: mediasafe/staging/smoke
        property: message
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smoke
  namespace: mediasafe-prod
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: smoke
  data:
    - secretKey: message
      remoteRef:
        key: mediasafe/prod/smoke
        property: message
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smoke-reads-prod
  namespace: mediasafe-staging
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: smoke-reads-prod
  data:
    - secretKey: message
      remoteRef:
        key: mediasafe/prod/smoke
        property: message
