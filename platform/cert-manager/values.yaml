# Chart reference: https://github.com/cert-manager/cert-manager/tree/v1.21.2/deploy/charts/cert-manager

crds:
  enabled: true
  # Uninstalling the chart must not delete every Certificate and Issuer with the CRDs.
  keep: true

config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  # Issue certificates for Gateway listeners (the cert-manager.io/cluster-issuer annotation on
  # platform/edge/gateway.yaml), and answer HTTP-01 challenges with HTTPRoutes.
  gatewayAPI:
    enabled: true
