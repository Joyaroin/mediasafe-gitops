# Traefik as a Gateway API implementation and nothing else.
# Chart reference: https://github.com/traefik/traefik-helm-chart/tree/v41.6.1/traefik

providers:
  kubernetesGateway:
    enabled: true
  # Nothing here uses Ingress or Traefik's own IngressRoute CRDs: routes are HTTPRoutes.
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: false

# The GatewayClass, named so Gateways can ask for it. The Gateway itself lives in git, in
# platform/edge/, with the listeners and certificates this cluster actually serves.
gatewayClass:
  enabled: true
  name: traefik
gateway:
  enabled: false

# Cluster-internal: the only client is cloudflared (platform/cloudflared), so nothing is bound on
# the node's network. Every request therefore arrives from cloudflared's pod address; the
# visitor's IP travels in Cloudflare's CF-Connecting-IP header, which the app reads for Better
# Auth's rate limiting.
service:
  spec:
    type: ClusterIP
