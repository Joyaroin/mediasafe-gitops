# Argo CD on a 4 GB node shared with Vault and two app environments: only the parts used.
# Chart reference: https://github.com/argoproj/argo-helm/tree/argo-cd-10.9.6/charts/argo-cd

global:
  domain: argocd.mediasafe.space

# Sign-in is Google OIDC, which Argo CD speaks natively. No Dex needed.
dex:
  enabled: false

# Nothing here sends notifications.
notifications:
  enabled: false

# Every app is a plain Application in apps/, so the ApplicationSet controller has no work.
# The chart has no switch for it; zero replicas is the way off.
applicationSet:
  replicas: 0

configs:
  params:
    # TLS terminates at Traefik, which talks plain HTTP to argocd-server
    # (platform/argocd-public/httproute.yaml).
    server.insecure: true
  cm:
    # No local admin account: Google sign-in is the only way in through the UI or API. If it
    # breaks, `kubectl -n argocd port-forward` doesn't help (it needs a login too); fix
    # oidc.config here or use the CLI's --core mode, which talks to Kubernetes directly.
    admin.enabled: false

    # Google sign-in. The client is "MediaSafe admin", the same one Vault's admin login uses.
    # Its id and secret come from Secret argocd-google-oidc, which External Secrets syncs from
    # Vault's kv/infra/argocd/google-oidc (platform/argocd-public/). Argo CD resolves
    # $<secret>:<key> only in Secrets labelled app.kubernetes.io/part-of: argocd.
    # The callback, https://argocd.mediasafe.space/auth/callback, is registered on the client.
    oidc.config: |
      name: Google
      issuer: https://accounts.google.com
      clientID: $argocd-google-oidc:clientID
      clientSecret: $argocd-google-oidc:clientSecret
      requestedScopes: ["openid", "profile", "email"]

    # Gives each child Application a health, so the root app's sync waves wait for a wave to be
    # Healthy before starting the next — not merely created. Without it, cert-manager could
    # start before the Gateway API CRDs exist and silently run without Gateway support.
    # From https://argo-cd.readthedocs.io/en/stable/operator-manual/health/#argocd-app
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

  # One person administers this cluster; any other Google account that signs in gets nothing
  # (policy.default is empty). Matched on the email claim, since Google sends no groups.
  rbac:
    policy.default: ""
    policy.csv: |
      g, adhamseddik546@gmail.com, role:admin
    scopes: "[email]"
