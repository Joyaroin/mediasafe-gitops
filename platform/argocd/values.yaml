# Argo CD on a 4 GB node shared with Vault and two app environments: only the parts used.
# Chart reference: https://github.com/argoproj/argo-helm/tree/argo-cd-10.9.6/charts/argo-cd

global:
  domain: argocd.mediasafe.space

# Sign-in will be Google OIDC, which Argo CD speaks natively (stage 5). No Dex needed.
dex:
  enabled: false

# Nothing here sends notifications.
notifications:
  enabled: false

# Every app is a plain Application in apps/, so the ApplicationSet controller has no work.
# The chart has no switch for it; zero replicas is the way off.
applicationSet:
  replicas: 0

configs:
  params:
    # TLS will terminate at Traefik (stage 4), which talks plain HTTP to argocd-server.
    # Until then the UI is reached only by port-forward.
    server.insecure: true
  cm:
    # The local admin account, until Google sign-in replaces it in stage 5.
    admin.enabled: true

    # Gives each child Application a health, so the root app's sync waves wait for a wave to be
    # Healthy before starting the next — not merely created. Without it, cert-manager could
    # start before the Gateway API CRDs exist and silently run without Gateway support.
    # From https://argo-cd.readthedocs.io/en/stable/operator-manual/health/#argocd-app
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
