# The tunnel connector. Its routes live in Cloudflare (infra/terraform in the app repo): each
# public hostname goes to https://traefik.traefik.svc.cluster.local:443 with that hostname as
# SNI, so Traefik picks the Gateway listener and certificate exactly as for a direct visitor.
#
# Two replicas on one node: a rollout or a crash of one keeps the other's connections up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7
          args: [tunnel, --no-autoupdate, --metrics, 0.0.0.0:2000, run]
          env:
            # Read by `tunnel run` in place of --token, so the token is not in the pod's args.
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tunnel-token
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          # /ready answers 200 once the connector holds at least one connection to Cloudflare.
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
