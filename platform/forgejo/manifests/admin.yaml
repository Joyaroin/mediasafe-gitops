# Forgejo's admin login, from Vault. Same pattern as cloudflared: the SecretStore logs in as role
# eso-forgejo (MediaSafe's infra/vault), whose policy reads kv/infra/forgejo/* and nothing else.
#
# Generated once, never typed: vault kv put kv/infra/forgejo/admin username=adham \
#   password="$(openssl rand -base64 24)"
# Read it back with: vault kv get -field=password kv/infra/forgejo/admin
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  namespace: forgejo
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: forgejo
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-forgejo
          serviceAccountRef:
            name: vault-reader
            audiences:
              - vault
---
# The chart reads keys username and password from gitea.admin.existingSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: forgejo-admin
  data:
    - secretKey: username
      remoteRef:
        key: infra/forgejo/admin
        property: username
    - secretKey: password
      remoteRef:
        key: infra/forgejo/admin
        property: password
