# Forgejo on the tailnet. The Tailscale operator sees ingressClassName tailscale and starts a
# proxy pod that joins the tailnet as the device `forgejo` (the tls host), with a Let's Encrypt
# certificate for forgejo.tailf69bc5.ts.net. Not on the Gateway and not through the Cloudflare
# Tunnel: nothing on the internet can reach it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo
  namespace: forgejo
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: forgejo-http
      port:
        number: 3000
  tls:
    - hosts:
        - forgejo
