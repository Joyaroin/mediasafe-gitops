# Every plain-HTTP request is redirected to HTTPS — except Let's Encrypt's challenges. Those
# don't need an exception here: cert-manager answers each one with its own HTTPRoute matching
# the exact path /.well-known/acme-challenge/<token>, and an Exact path match takes precedence
# over this rule's catch-all "/" prefix.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gateway
spec:
  parentRefs:
    - name: public
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
