# The one Gateway. Every hostname the cluster serves is a listener here, and each HTTPS
# listener's certificate is issued by cert-manager from the annotation below: it creates one
# Certificate per certificateRefs secret, for that listener's hostname.
#
# Nothing reaches it from the internet directly. Traefik's Service is cluster-internal, and the
# only way in is the Cloudflare Tunnel (platform/cloudflared), which connects to Traefik's HTTPS
# port with each request's hostname as SNI. So there is no plain-HTTP listener: Cloudflare
# redirects visitors to HTTPS at its edge, and certificates are proven over DNS, not port 80.
#
# Ports are Traefik's entrypoint ports (8443), not 443: Traefik matches listeners to its
# entrypoints by port, and its Service maps 443→8443.
#
# Each hostname accepts routes from one namespace only, so no other namespace can claim it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: traefik
  listeners:
    - name: https-apex
      hostname: mediasafe.space
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: mediasafe-space-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: mediasafe-prod

    - name: https-staging
      hostname: staging.mediasafe.space
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: staging-mediasafe-space-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: mediasafe-staging

    - name: https-argocd
      hostname: argocd.mediasafe.space
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: argocd-mediasafe-space-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
