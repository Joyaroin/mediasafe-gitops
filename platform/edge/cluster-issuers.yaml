# Let's Encrypt, proving each hostname with a DNS-01 challenge: cert-manager writes a TXT record
# through Cloudflare's API. HTTP-01 is not possible here — the cluster has no public port 80.
# The API token (Zone → DNS → Edit on mediasafe.space only) comes from Vault through
# cloudflare-api-token.yaml.
#
# Staging is kept for trying changes to the edge: its certificates aren't browser-trusted, but
# its rate limits are generous, so a misconfiguration costs nothing. Point the Gateway's
# annotation at it while experimenting, then back at letsencrypt-prod.
#
# No contact email: Let's Encrypt no longer sends expiry mail, and cert-manager renews 30 days
# before expiry on its own.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: apiToken
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: apiToken
