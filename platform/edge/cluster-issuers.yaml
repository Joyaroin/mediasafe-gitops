# Let's Encrypt, answering HTTP-01 challenges through the Gateway's plain-HTTP listener.
#
# Staging first: its certificates aren't browser-trusted, but its rate limits are generous, so a
# misconfiguration costs nothing. The Gateway is switched to letsencrypt-prod once staging
# issues cleanly.
#
# No contact email: Let's Encrypt no longer sends expiry mail, and cert-manager renews 30 days
# before expiry on its own.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: public
                namespace: gateway
                sectionName: http
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: public
                namespace: gateway
                sectionName: http
