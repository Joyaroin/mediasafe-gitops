# cert-manager's Cloudflare API token, from Vault, for the DNS-01 challenges in
# cluster-issuers.yaml. In cert-manager's namespace because a ClusterIssuer reads its secrets
# from there. Same pattern as the app namespaces: the SecretStore logs in to Vault's Kubernetes
# auth as role eso-cert-manager (infra/vault), whose policy reads kv/infra/cert-manager/* and
# nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  namespace: cert-manager
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: cert-manager
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-cert-manager
          serviceAccountRef:
            name: vault-reader
            audiences:
              - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: cloudflare-api-token
  data:
    - secretKey: apiToken
      remoteRef:
        key: infra/cert-manager/cloudflare
        property: apiToken
