# The operator's OAuth client, from Vault. Same pattern as cloudflared: the SecretStore logs in
# to Vault as role eso-tailscale (MediaSafe's infra/vault), whose policy reads
# kv/infra/tailscale/* and nothing else.
#
# The client is created in the Tailscale admin console (Settings → OAuth clients) with the
# scopes Devices Core and Auth Keys (write), tag tag:k8s-operator, and stored with:
#   vault kv put kv/infra/tailscale/operator client_id=… client_secret=…
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  namespace: tailscale
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: tailscale
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-tailscale
          serviceAccountRef:
            name: vault-reader
            audiences:
              - vault
---
# The chart's operator Deployment mounts a Secret by exactly this name, with these two keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: operator-oauth
  data:
    - secretKey: client_id
      remoteRef:
        key: infra/tailscale/operator
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: infra/tailscale/operator
        property: client_secret
